<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniMark - Configuration</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { padding: 20px; text-align: left; height: auto; display: block; overflow-y: auto; }
        .options-container { max-width: 800px; margin: 0 auto; background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 10px; }
        .form-group { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--secondary-color); }
        label { display: block; margin-bottom: 5px; color: var(--primary-color); }
        input, select { width: 100%; padding: 8px; margin-bottom: 10px; background: var(--bg-color); border: 1px solid var(--secondary-color); color: white; border-radius: 4px; }
        button { background: var(--secondary-color); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        button:hover { background: var(--primary-color); }
        .delete-btn { background: #ff4444; margin-left: 10px; padding: 5px 10px; font-size: 12px; }
        .move-btn { background: var(--secondary-color); margin-left: 5px; padding: 5px 10px; font-size: 12px; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .move-btn:hover { background: var(--primary-color); }
        .btn-group { display: flex; align-items: center; }
        .category-list { margin-top: 30px; }
        .cat-item { 
            margin-bottom: 25px; 
            padding: 15px; 
            background: rgba(255, 255, 255, 0.03); 
            border-radius: 8px; 
            border: 1px solid var(--secondary-color);
            transition: border-color 0.3s;
        }
        .cat-item:hover { border-color: var(--primary-color); }
        .cat-item strong { color: var(--primary-color); font-size: 16px; display: flex; align-items: center; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .link-item { margin-left: 20px; font-size: 14px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; background: rgba(255, 255, 255, 0.03); padding: 8px; border-radius: 4px; color: #e0e0e0; }
        .link-item small { color: #888; margin-left: 10px; font-family: consolas, monospace; }
        .icon-config { display: flex; gap: 10px; width: 100%; margin-top: 5px; }
        .icon-config select, .icon-config input { font-size: 12px; margin-bottom: 0; }
        h1 { margin-bottom: 30px; color: var(--primary-color); letter-spacing: 2px; }

        /* Styles pour les onglets */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--secondary-color); padding-bottom: 10px; }
        .tab-btn { background: transparent; border: none; color: var(--secondary-color); font-size: 18px; cursor: pointer; padding: 5px 15px; border-radius: 4px; transition: 0.3s; font-family: inherit; }
        .tab-btn.active { color: var(--primary-color); background: rgba(33, 150, 243, 0.1); }
        .tab-btn:hover:not(.active) { color: white; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        
        .search-engine-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: rgba(255, 255, 255, 0.02); padding: 10px; border-radius: 4px; border-left: 3px solid var(--primary-color); }
        .engine-info { flex: 1; font-size: 14px; }
        .engine-info strong { color: white; margin-right: 10px; }
        .engine-info small { color: #888; }

        .back-link {
            text-decoration: none;
            color: var(--primary-color);
            border: 1px solid var(--secondary-color);
            padding: 5px 15px;
            border-radius: 4px;
            transition: 0.3s;
            font-size: 14px;
            display: inline-block;
        }
        .back-link:hover {
            background: rgba(33, 150, 243, 0.1);
            color: white;
            border-color: var(--primary-color);
        }
        .credits {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid var(--secondary-color);
            text-align: center;
            font-size: 12px;
            color: var(--secondary-color);
        }
        .credits a {
            color: var(--primary-color);
            text-decoration: none;
        }
        .credits a:hover {
            text-decoration: underline;
        }
        .is-invalid { border-color: #ff4444 !important; }
        .bookmark-search-container { margin-top: 20px; padding: 15px; background: rgba(255, 255, 255, 0.03); border-radius: 8px; border: 1px solid var(--secondary-color); }
        #system-bookmark-results { margin-top: 10px; max-height: 200px; overflow-y: auto; background: var(--bg-color); border: 1px solid var(--secondary-color); border-radius: 4px; }
        .system-bookmark-item { padding: 10px; cursor: pointer; border-bottom: 1px solid rgba(255, 255, 255, 0.1); transition: background 0.2s; }
        .system-bookmark-item:hover { background: rgba(33, 150, 243, 0.15); }
        .system-bookmark-item strong { color: var(--primary-color); display: block; font-size: 15px; margin-bottom: 2px; }
        .system-bookmark-item small { color: #888; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .checkbox-group input { width: auto; margin-bottom: 0; }

        /* Custom checkbox toggle */
        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--secondary-color);
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-color);
        }

        input:checked + .slider:before {
            transform: translateX(14px);
        }
    </style>
</head>
<body>
    <div class="options-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1 style="margin-bottom: 0;">Configuration</h1>
            <a href="index.html" class="back-link">← Retour</a>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="tab-bookmarks">Favoris</button>
            <button class="tab-btn" data-tab="tab-search">Raccourcis de Recherche</button>
        </div>

        <div id="tab-bookmarks" class="tab-pane active">
            <div class="form-group">
                <h3>Ajouter une Catégorie</h3>
                <label for="new-cat-name">Nom de la catégorie</label>
                <input type="text" id="new-cat-name" placeholder="Nom de la catégorie (ex: Travail, Loisirs)">
                <label for="new-cat-column">Numéro de colonne (pour le regroupement)</label>
                <input type="number" id="new-cat-column" value="1" min="1">
                <button id="add-cat">Ajouter la catégorie</button>
            </div>

            <div class="form-group">
                <div class="checkbox-group" style="margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed var(--secondary-color);">
                    <label class="switch">
                        <input type="checkbox" id="enable-system-search">
                        <span class="slider"></span>
                    </label>
                    <span style="color: var(--primary-color); font-size: 14px;">Activer l'aide à l'ajout via les favoris du navigateur</span>
                </div>

                <div id="system-bookmark-search" class="bookmark-search-container" style="display: none; margin-bottom: 20px;">
                    <label for="system-search-input">Rechercher dans vos favoris système</label>
                    <input type="text" id="system-search-input" placeholder="Tapez pour rechercher un favori...">
                    <div id="system-bookmark-results" style="display: none;"></div>
                </div>

                <div class="settings-group" style="margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed var(--secondary-color);">
                    <label for="logodev-token">Clé API Logo.dev (facultatif si non utilisé)</label>
                    <input type="password" id="logodev-token" placeholder="VOTRE_CLE">
                    <small style="color: var(--secondary-color); font-size: 11px;">Nécessaire si vous utilisez le type d'icône Logo.dev</small>
                </div>

                <h3>Ajouter un Lien</h3>
                <label for="link-cat-select">Catégorie</label>
                <select id="link-cat-select"></select>
                <label for="link-title">Nom du lien</label>
                <input type="text" id="link-title" placeholder="Nom du site">
                <label for="link-url">URL</label>
                <input type="url" id="link-url" placeholder="https://...">
                
                <label for="link-icon-type">Type d'icône</label>
                <select id="link-icon-type">
                    <option value="favicon">Favicon (Auto)</option>
                    <option value="emoji">Emoji / Texte</option>
                    <option value="simpleicons">Simple Icons (slug)</option>
                    <option value="logodev">Logo.dev (domaine)</option>
                    <option value="custom">URL Image / SVG</option>
                </select>
                
                <div id="logodev-theme-container" style="display: none;">
                    <label for="link-icon-theme">Thème Logo.dev</label>
                    <select id="link-icon-theme">
                        <option value="light">Clair (Light)</option>
                        <option value="dark" selected>Sombre (Dark)</option>
                    </select>
                </div>

                <label for="link-icon-value">Valeur de l'icône (Emoji, slug, domaine ou URL)</label>
                <input type="text" id="link-icon-value" placeholder="⭐, github, google.com ou https://...">
                
                <button id="add-link">Ajouter le lien</button>
            </div>

            <div class="category-list">
                <h3>Vos Catégories et Liens</h3>
                <div id="data-list"></div>
            </div>
        </div>

        <div id="tab-search" class="tab-pane">
            <div class="form-group">
                <h3>Ajouter un Raccourci</h3>
                <label for="search-prefix">Préfixe (ex: gh:)</label>
                <input type="text" id="search-prefix" placeholder="gh:">
                <label for="search-name">Nom du moteur</label>
                <input type="text" id="search-name" placeholder="GitHub">
                <label for="search-url">URL de recherche (utilisez %s pour la requête)</label>
                <input type="text" id="search-url" placeholder="https://github.com/search?q=%s">
                <label for="search-icon">Icône (Emoji ou URL)</label>
                <input type="text" id="search-icon" placeholder="🐙">
                <button id="add-search-engine">Ajouter le raccourci</button>
            </div>

            <div class="category-list">
                <h3>Raccourcis Actuels</h3>
                <div id="search-engines-list"></div>
            </div>
        </div>

        <div class="credits">
            Design inspiré par le <a href="https://codepen.io/base0/pen/wvaLxPv" target="_blank">Codepen de Otto (base0)</a>
        </div>
    </div>
    <script src="js/options.js"></script>
</body>
</html>
